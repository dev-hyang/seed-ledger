<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>控件图鉴 · 稻种账本</title>
<link rel="stylesheet" href="shared/ui.css">
<link rel="stylesheet" href="app.css">
<style>
  .sg { max-width: 920px; margin: 0 auto; padding: 20px 16px 64px; }
  .sg h1 { font-size: 22px; margin: 0 0 6px; }
  .sg h2 { font-size: 17px; margin: 30px 0 10px; padding-top: 14px; border-top: 1px solid var(--line); }
  .sg p.note { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
  .sg .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 12px; }
  .sg .cell { display: grid; gap: 6px; justify-items: start; }
  .sg .cell > small { color: var(--muted); font-size: 12px; }
  .sg .panel { padding: 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
  .sg .tipzone { padding-top: 44px; }
  .sg code { font-size: 12px; background: var(--field); padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<main class="sg">
  <h1>控件图鉴</h1>
  <p class="note">和爱家小助手共用的徽标、铃铛、提示（<code>shared/ui.css</code>），颜色用本站色板。电脑和手机各看一遍；深色模式跟随系统。现有页面还没有接入这些控件，这里只做验收。</p>

  <h2>徽标 ui-badge</h2>
  <div class="panel"><div class="row">
    <span class="ui-badge">neutral</span>
    <span class="ui-badge" data-tone="ok">ok</span>
    <span class="ui-badge" data-tone="warn">warn</span>
    <span class="ui-badge" data-tone="caution">caution</span>
    <span class="ui-badge" data-tone="danger">danger</span>
    <span class="ui-badge" data-tone="accent">accent</span>
  </div>
  <div class="row">
    <span class="ui-badge" data-tone="ok" data-size="sm">小 sm</span>
    <span class="ui-badge" data-tone="ok">中 md</span>
    <span class="ui-badge" data-tone="ok" data-size="lg">大 lg</span>
  </div>
  <div class="row">
    <span class="ui-badge" data-tone="danger" data-icon="dot">已逾期</span>
    <span class="ui-badge" data-tone="caution" data-icon="dot">快到期</span>
    <span class="ui-badge" data-tone="ok" data-icon="dot">已完成</span>
    <span class="ui-badge" data-tone="neutral" data-outline>未设置</span>
    <span class="ui-badge" data-tone="accent" data-outline data-icon="dot">新</span>
  </div>
  <div class="row">
    <span class="ui-badge" data-shape="count" data-size="sm">3</span>
    <span class="ui-badge" data-shape="count">12</span>
    <span class="ui-badge" data-shape="count" data-size="lg">99+</span>
    <span class="ui-badge" data-shape="count" data-tone="ok">5</span>
    <span class="ui-badge" data-shape="count" data-tone="accent">7</span>
    <span class="ui-badge" data-shape="count" data-tone="neutral" data-soft data-size="lg">2</span>
    <span class="ui-badge" data-shape="dot" data-tone="danger" role="img" aria-label="有新提醒"></span>
    <span class="ui-badge" data-shape="dot" data-tone="ok" role="img" aria-label="正常"></span>
  </div></div>

  <h2>铃铛 ui-bell</h2>
  <div class="panel"><div class="row">
    <div class="cell"><button class="ui-bell" data-size="sm" aria-label="提醒"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></button><small>sm</small></div>
    <div class="cell"><button class="ui-bell" aria-label="提醒，3 条未读"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="ui-badge" data-shape="count" data-size="sm">3</span></button><small>md，数字</small></div>
    <div class="cell"><button class="ui-bell" data-size="lg" aria-label="提醒，12 条未读"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="ui-badge" data-shape="count">12</span></button><small>lg，数字</small></div>
    <div class="cell"><button class="ui-bell" aria-label="提醒，有新的"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="ui-badge" data-shape="dot" data-tone="danger"></span></button><small>红点</small></div>
    <div class="cell"><button class="ui-bell" data-ring aria-label="提醒，1 条新的"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span class="ui-badge" data-shape="count" data-size="sm">1</span></button><small>data-ring</small></div>
  </div></div>

  <h2>提示 ui-hint</h2>
  <div class="panel tipzone"><div class="row">
    <button class="ui-hint" type="button" data-tip="默认在上方，居中。" aria-label="说明：默认在上方，居中。">?</button>
    <button class="ui-hint" type="button" data-tip="在下方显示的提示。" data-tip-pos="bottom" aria-label="说明：在下方显示的提示。">?</button>
    <button class="ui-hint" type="button" data-tip="左对齐：靠屏幕左边的问号用这个，较长的提示文字会自动换行。" data-tip-align="start" aria-label="说明">?</button>
    <span style="flex:1"></span>
    <button class="ui-hint" type="button" data-tip="右对齐：靠屏幕右边的问号用这个。" data-tip-align="end" aria-label="说明：右对齐的提示">?</button>
  </div></div>

  <h2>本站现有的表单控件（对照）</h2>
  <div class="panel">
    <div class="field"><label for="sgA">输入框</label><input id="sgA" type="text" placeholder="例如：数学"></div>
    <div class="field"><label for="sgB">下拉</label><select id="sgB"><option>请选择</option><option>选项 A</option></select></div>
    <div class="field"><label for="sgC">日期</label><input id="sgC" type="date"></div>
    <div class="btns"><button class="btn primary" type="button">主按钮</button><button class="btn" type="button">次按钮</button><button class="btn sm" type="button">小按钮</button></div>
  </div>
</main>
</body>
</html>
